<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Product Security Architect animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="205" y="60" height="50" width="0">
        <animate attributeName="width" from="0" to="560" dur="2.2s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="card"><rect width="800" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="800" height="220" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#1f2a3d" stroke-width="1" opacity="0.6">
      <path d="M0 40H800M0 80H800M0 120H800M0 160H800M0 200H800"/>
      <path d="M40 0V220M120 0V220M200 0V220M280 0V220M360 0V220M440 0V220M520 0V220M600 0V220M680 0V220M760 0V220"/>
    </g>

    <!-- scan line -->
    <rect x="0" y="0" width="800" height="2" fill="#2ea043" opacity="0.35">
      <animate attributeName="y" values="0;218;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- shield glow -->
    <circle cx="110" cy="112" r="70" fill="#1f6feb" opacity="0.12">
      <animate attributeName="r" values="64;78;64" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- floor, desk, chair -->
    <rect x="36" y="203" width="156" height="2" rx="1" fill="#30363d"/>
    <rect x="100" y="150" width="92" height="5" rx="2" fill="#30363d"/>
    <rect x="186" y="155" width="5" height="48" fill="#30363d"/>
    <rect x="40" y="112" width="9" height="62" rx="4" fill="#30363d"/>
    <rect x="46" y="170" width="62" height="7" rx="3.5" fill="#3d4655"/>
    <rect x="74" y="177" width="5" height="22" fill="#30363d"/>
    <rect x="52" y="198" width="50" height="4" rx="2" fill="#30363d"/>

    <!-- screen glow toward the person -->
    <polygon points="176,100 176,142 108,108 108,84" fill="#58a6ff" opacity="0.12">
      <animate attributeName="opacity" values="0.06;0.2;0.06" dur="1.6s" repeatCount="indefinite"/>
    </polygon>

    <!-- legs -->
    <path d="M66 164 L112 164" stroke="#3a4252" stroke-width="13" stroke-linecap="round"/>
    <path d="M112 164 L116 194" stroke="#343c4b" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="123" cy="198" rx="11" ry="4.5" fill="#e6edf3"/>

    <!-- torso (breathing) -->
    <g>
      <path d="M58 170 C54 144 60 120 80 114 C96 112 102 124 102 140 L104 170 Z" fill="#2d5fb0"/>
      <polygon points="79,113 93,113 86,124" fill="#c8905f"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1.012 1.018;1 1" dur="3.5s" repeatCount="indefinite"/>
    </g>

    <!-- neck -->
    <rect x="80" y="102" width="13" height="14" rx="4" fill="#c8905f"/>

    <!-- head group (slight nod) -->
    <g>
      <path d="M72 90 C68 70 82 62 96 66 C104 69 105 77 103 81 C98 75 88 74 80 79 C76 83 76 88 76 94 Z" fill="#2b2118"/>
      <ellipse cx="88" cy="90" rx="15" ry="18" fill="#e0b48c"/>
      <path d="M72 90 C68 70 82 62 96 66 C104 69 105 77 103 81 C98 75 88 74 80 79 C76 83 76 88 76 94 Z" fill="#2b2118"/>
      <!-- face -->
      <path d="M103 90 L109 97 L103 98 Z" fill="#d9a577"/>
      <line x1="93" y1="81" x2="101" y2="80" stroke="#2b2118" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="98" cy="88" rx="1.8" ry="2" fill="#0d1117">
        <animate attributeName="ry" values="2;2;0.2;2;2" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <rect x="92" y="83" width="12" height="10" rx="4" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1.4"/>
      <path d="M95 104 Q99 106 103 103" fill="none" stroke="#a8693f" stroke-width="1.6" stroke-linecap="round"/>
      <!-- headphones -->
      <path d="M75 92 C73 68 103 64 104 82" fill="none" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="81" cy="94" rx="5.5" ry="7.5" fill="#c9d1d9"/>
      <ellipse cx="82" cy="94" rx="2.5" ry="4.5" fill="#6e7681"/>
      <animateTransform attributeName="transform" type="rotate" values="0 88 108;2.5 88 108;0 88 108" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- laptop (side profile) -->
    <rect x="122" y="142" width="62" height="8" rx="3" fill="#8b949e"/>
    <rect x="178" y="94" width="6" height="50" rx="3" fill="#c9d1d9" transform="rotate(8 181 144)"/>
    <g stroke="#3fb950" stroke-width="2" stroke-linecap="round">
      <line x1="175" y1="106" x2="175" y2="114"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></line>
      <line x1="175" y1="120" x2="175" y2="128"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/></line>
      <line x1="175" y1="132" x2="175" y2="138"><animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/></line>
    </g>

    <!-- far arm -->
    <path d="M90 124 L96 148 L146 141" fill="none" stroke="#244a8a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M90 124 L96 148 L146 141;M90 124 L96 148 L146 138;M90 124 L96 148 L146 141" dur="0.45s" begin="0.15s" repeatCount="indefinite"/>
    </path>
    <circle cx="147" cy="140" r="4.5" fill="#c8905f">
      <animate attributeName="cy" values="140;137;140" dur="0.45s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <!-- near arm -->
    <path d="M84 124 L88 148 L136 141" fill="none" stroke="#2d5fb0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M84 124 L88 148 L136 138;M84 124 L88 148 L136 141;M84 124 L88 148 L136 138" dur="0.45s" repeatCount="indefinite"/>
    </path>
    <circle cx="137" cy="137" r="4.5" fill="#e0b48c">
      <animate attributeName="cy" values="137;140;137" dur="0.45s" repeatCount="indefinite"/>
    </circle>

    <!-- floating shield above the laptop -->
    <g>
      <path d="M150 38 L166 44 V58 C166 68 158 74 150 78 C142 74 134 68 134 58 V44 Z" fill="#0d1117" stroke="url(#shield)" stroke-width="3" stroke-linejoin="round">
        <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M143 57 L148 63 L158 51" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- rising code symbols -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#58a6ff">
      <text x="122" y="112" opacity="0">&lt;/&gt;
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="120;90" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="170" y="96" opacity="0">{ }
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="96;70" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- title (typewriter) -->
    <g clip-path="url(#typing)">
      <text x="205" y="98" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="30" font-weight="700" fill="#e6edf3">Product Security Architect</text>
    </g>

    <!-- domains -->
    <text x="205" y="128" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#58a6ff" opacity="0">
      AI  ·  Mobile  ·  Embedded  ·  Cloud
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/>
    </text>

    <!-- rotating focus lines -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#3fb950">
      <text x="205" y="170" opacity="0">&gt; threat modeling
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.31;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="205" y="170" opacity="0">&gt; secure-by-design
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.64;0.67;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="205" y="170" opacity="0">&gt; writing security tooling
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.97;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <rect x="0" y="0" width="0" height="0"/>
    </g>

    <!-- blinking cursor -->
    <rect x="205" y="180" width="10" height="3" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
